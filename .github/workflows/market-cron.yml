name: Market Price Cron Jobs

on:
  schedule:
    # Refresh prices every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
    # Capture snapshot daily at 2 AM UTC
    - cron: '0 2 * * *'
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job to run (refresh or snapshot)'
        required: true
        default: 'refresh'
        type: choice
        options:
          - refresh
          - snapshot

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    # Run at 00:00, 06:00, 12:00, 18:00 OR when manually triggered with 'refresh'
    if: github.event.schedule == '0 */6 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'refresh')
    steps:
      - name: Call refresh prices endpoint
        run: |
          response=$(curl -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_CODE:%{http_code}" \
            ${{ secrets.BACKEND_URL }}/admin/cron/refresh-prices)
          
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_CODE:/d')
          
          echo "Response: $body"
          echo "HTTP Code: $http_code"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Failed to refresh prices"
            exit 1
          fi
          
          echo "✅ Prices refreshed successfully"

  capture-snapshot:
    runs-on: ubuntu-latest
    # Run at 2 AM UTC OR when manually triggered with 'snapshot'
    if: github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'snapshot')
    steps:
      - name: Call snapshot endpoint
        run: |
          response=$(curl -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_CODE:%{http_code}" \
            ${{ secrets.BACKEND_URL }}/admin/cron/price-snapshot)
          
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_CODE:/d')
          
          echo "Response: $body"
          echo "HTTP Code: $http_code"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Failed to capture snapshot"
            exit 1
          fi
          
          echo "✅ Snapshot captured successfully"